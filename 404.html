<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting — ARNE Works</title>
    <script>
        // GitHub Pages SPA router redirect
        try {
            sessionStorage.redirect = location.href;
            var path = window.location.pathname.toLowerCase();
            if (path.includes('/payment')) {
                window.location.replace('/payment.html');
            } else if (path.includes('/confirmation')) {
                window.location.replace('/confirmation.html');
            } else if (path.includes('/privacy-policy')) {
                window.location.replace('/privacy-policy.html');
            } else if (path.includes('/terms')) {
                window.location.replace('/terms.html');
            } else if (path !== '/' && path !== '/index.html') {
                window.location.replace('/');
            }
        } catch (e) {
            console.error(e);
        }
    </script>
</head>
<body style="background: #060907; color: #ffffff; font-family: sans-serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0;">
    <div style="text-align: center;">
        <h2 style="color: #00ff88;">ARNE WORKS</h2>
        <p>Redirecting to <a href="/" style="color: #00ff88; text-decoration: underline;">Homepage</a>...</p>
    </div>
</body>
</html>
